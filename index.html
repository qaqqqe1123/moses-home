<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MOSES — 官方入口</title>
  <meta name="description" content="MOSES 官方入口：专业工具箱与 MOSES超频 下载与服务。" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070b10;
      --ink: #eef5fa;
      --muted: #8499ad;
      --teal: #2dd4bf;
      --violet: #c25dff;
      --line: #1a2733;
      --font-display: "Syne", sans-serif;
      --font-body: "Manrope", sans-serif;
      --max: 980px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: var(--teal); color: #04201b; }
    img { display: block; max-width: 100%; }

    .page {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(ellipse 50% 45% at 20% 20%, rgba(45, 212, 191, 0.12), transparent 55%),
        radial-gradient(ellipse 45% 40% at 85% 70%, rgba(194, 93, 255, 0.12), transparent 55%),
        linear-gradient(160deg, #0b1218, #070b10 55%, #06080c);
    }

    .wrap {
      width: min(100% - 2.5rem, var(--max));
      margin: 0 auto;
      padding: 2.5rem 0 3rem;
    }

    header {
      text-align: center;
      padding: 2.5rem 0 2.75rem;
      animation: in 0.75s ease both;
    }

    .logo-row {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1rem;
    }
    .logo-row img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.4rem, 5vw + 0.8rem, 3.6rem);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 0.75rem;
    }
    h1 b { color: var(--teal); font-weight: inherit; }

    .intro {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 26rem;
      margin: 0 auto;
    }

    .products {
      display: grid;
      gap: 1rem;
      animation: in 0.9s ease 0.08s both;
    }

    .product {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 1.1rem;
      align-items: center;
      padding: 1.25rem 1.35rem;
      border: 1px solid var(--line);
      background: rgba(10, 16, 22, 0.72);
      transition: border-color 0.25s, transform 0.25s, background 0.25s;
    }
    .product:hover {
      transform: translateY(-2px);
      background: rgba(14, 22, 30, 0.9);
    }
    .product--toolkit:hover { border-color: rgba(45, 212, 191, 0.45); }
    .product--oc:hover { border-color: rgba(194, 93, 255, 0.45); }

    .product img.icon {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 16px;
    }

    .product h2 {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .product p {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .product .url {
      margin-top: 0.45rem;
      font-size: 0.82rem;
      color: #6f8599;
      word-break: break-all;
    }

    .go {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.65rem 1rem;
      border: 1px solid var(--line);
      white-space: nowrap;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .product--toolkit .go {
      color: #04201b;
      background: var(--teal);
      border-color: transparent;
    }
    .product--toolkit .go:hover { background: #5eead4; }
    .product--oc .go {
      color: #1a0a28;
      background: var(--violet);
      border-color: transparent;
    }
    .product--oc .go:hover { background: #d67aff; }

    .contact {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      animation: in 1s ease 0.12s both;
    }
    .contact h3 {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.15rem;
    }
    .contact p { color: var(--muted); font-size: 0.92rem; }
    .contact button {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.98rem;
      color: var(--teal);
      background: none;
      border: none;
      border-bottom: 1px solid transparent;
      cursor: pointer;
      padding: 0.15rem 0;
    }
    .contact button:hover { border-bottom-color: var(--teal); }

    footer {
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.84rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.35rem;
      transform: translate(-50%, 140%);
      background: #0e1620;
      border: 1px solid var(--line);
      padding: 0.6rem 1rem;
      font-size: 0.88rem;
      z-index: 20;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    .toast.on { transform: translate(-50%, 0); }

    @keyframes in {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .product {
        grid-template-columns: 64px 1fr;
        grid-template-rows: auto auto;
      }
      .product img.icon { width: 56px; height: 56px; border-radius: 12px; }
      .go {
        grid-column: 1 / -1;
        text-align: center;
        justify-content: center;
      }
      .contact { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg" aria-hidden="true"></div>
    <div class="wrap">
      <header>
        <div class="logo-row">
          <img src="favicon.png" width="36" height="36" alt="" />
        </div>
        <h1>MOSES<b>.</b></h1>
        <p class="intro">官方入口。选择工具进入下载页。</p>
      </header>

      <div class="products">
        <a class="product product--toolkit" href="http://moses.gjc.com/" target="_blank" rel="noopener">
          <img class="icon" src="toolbox.png" width="72" height="72" alt="" />
          <div>
            <h2>MOSES 工具箱</h2>
            <p>硬件检测、调校与压力测试工具集合。</p>
            <div class="url">moses.gjc.com</div>
          </div>
          <span class="go">进入</span>
        </a>

        <a class="product product--oc" href="http://moses.youhua.com/" target="_blank" rel="noopener">
          <img class="icon" src="oc.png" width="72" height="72" alt="" />
          <div>
            <h2>MOSES超频</h2>
            <p>清理、优化、监控、驱动与电源计划。</p>
            <div class="url">moses.youhua.com</div>
          </div>
          <span class="go">进入</span>
        </a>
      </div>

      <div class="contact">
        <div>
          <h3>联系作者</h3>
          <p>抖音搜索咨询超频与调校服务。</p>
        </div>
        <button type="button" id="copyDy" data-id="MOSES">抖音：MOSES</button>
      </div>

      <footer>
        <span>© 2026 MOSES</span>
        <span>备用：GitHub Pages 仍可访问</span>
      </footer>
    </div>
  </div>

  <div class="toast" id="toast">抖音号已复制</div>

  <script>
    (function () {
      var dy = document.getElementById("copyDy");
      var toast = document.getElementById("toast");
      var timer;
      dy.addEventListener("click", function () {
        var text = dy.getAttribute("data-id") || "MOSES";
        function show() {
          toast.classList.add("on");
          clearTimeout(timer);
          timer = setTimeout(function () { toast.classList.remove("on"); }, 1600);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(show).catch(function () {
            window.prompt("复制抖音号", text);
          });
        } else {
          window.prompt("复制抖音号", text);
        }
      });
    })();
  </script>
</body>
</html>
