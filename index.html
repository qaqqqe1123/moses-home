让你的电脑在合理范围内发挥更稳定、更适合实际使用的性能。"]},{q:"超频会不会损坏硬件或影响保修？",a:"我们所有调校都在厂商标定的电压安全区间内进行，并以温度墙与长时稳定性为第一优先级。绝大多数主板 BIOS 层面的超频不会触发硬件保修条款；涉及拆装散热、更换导热材料等可能影响保修的操作，我们会在动手前明确告知并征得您同意。"},{q:"远程调校安全吗？需要准备什么？",a:"远程会话全程录屏，仅操作 BIOS 与性能相关软件，不接触个人文件。您需要准备一台可联网的副机或手机用于沟通，以及在断电重启后可自行进入 BIOS 的基本操作能力，我们会一步步指引。"},{q:"调校后不稳定怎么办？",a:"质保期内免费复调，不限次数。我们会保留您的原始 BIOS 配置与超频配置双份存档，任何时候都可以一键回滚到出厂状态。"},{q:"支持哪些平台和硬件？",a:"Intel 12/13/14 代及 Core Ultra 系列，AMD Ryzen 3000–9000 系列，主流 Z / B / X 系列主板，NVIDIA RTX 20 系及以后、AMD RX 6000 系及以后显卡。工作站与服务器平台请单独咨询。"}],ax=[{title:"什么是超频？",paragraphs:["超频不是简单地拉高频率，也不是通过暴力加压去换性能。","真正的超频，是根据 CPU 体质、内存颗粒、主板供电、散热条件，重新调整一套更适合你电脑的参数，让硬件发挥出更合理的性能。","很多玩家对超频存在误解，认为超频就是高电压、高温度、伤硬件。这种为了跑分而盲目堆电压的方式，确实不值得推荐。","专业调校的核心不是「压榨硬件」，而是在性能、温度、功耗和稳定性之间找到最佳平衡点。"]},{title:"为什么默认设置不是最佳状态？",paragraphs:["CPU、内存和主板出厂参数，需要兼容大量不同硬件组合。为了保证所有用户都能正常启动，厂家通常会采用："],bullets:["保守频率","较高安全电压","宽松内存时序","默认功耗限制"],note:"这些参数可以保证稳定，但并不一定适合你的这台电脑。同一型号 CPU，不同体质可能存在明显差异。优秀的调校，就是找到属于你这颗 CPU、这套内存的最佳参数。"},{title:"合理调校为什么可能降低温度？",paragraphs:["性能提升并不一定意味着温度增加。很多情况下，默认设置为了保证兼容性，会给 CPU 提供较高电压。更合理的调校方式通常是："],bullets:["优化 CPU 电压","调整功耗限制","优化频率曲线","调整内存时序"],subsections:[{title:"让硬件减少不必要的电压消耗，在更稳定的状态下运行，结果可能出现：",bullets:["性能提升","温度下降","功耗降低","频率更加稳定"]}]},{title:"CPU + 内存双调校",paragraphs:["我们提供的不只是单独 CPU 超频，而是 CPU 与内存协同优化。"],subsections:[{title:"CPU 影响",bullets:["计算性能","游戏帧率上限","多任务响应"]},{title:"内存影响",bullets:["数据延迟","游戏响应速度","CPU 数据调用效率"]},{title:"同时结合",bullets:["主板 BIOS 设置","电压调整","稳定性测试"]}],note:"让整个平台达到更好的性能表现。"},{title:"超频能改善什么？",paragraphs:["超频最大的提升，通常不是平均帧率突然翻倍，而是改善游戏过程中不稳定的体验。例如："],bullets:["团战瞬间掉帧","快速转视角卡顿","跑图加载不顺","Low FPS 偏低","帧时间波动明显"],subsections:[{title:"CPU 性能释放",paragraphs:["让 CPU 在合理电压和温度下稳定运行。"]},{title:"内存性能释放",paragraphs:["根据内存颗粒和平台能力调整频率及时序。"]},{title:"Low 帧优化",paragraphs:["降低帧时间波动，让游戏画面更加稳定流畅。"]},{title:"性能上限释放",paragraphs:["在硬件体质允许范围内，提高平台性能潜力。"]},{title:"温度与功耗优化",paragraphs:["Intel 平台重点优化电压、功耗和温度；AMD 平台重点优化 PBO、曲线和内存性能。"]}]},{title:"调试过程需要多久？",paragraphs:["超频调试不是修改几个参数后立即完成。过程中可能需要进入 BIOS 调整参数、多次重启测试、稳定性测试与游戏实际验证。","部分参数测试期间可能出现蓝屏、黑屏或自动恢复默认设置——这是寻找稳定参数过程中的正常测试现象，并不代表硬件损坏。"],subsections:[{title:"一般调试时间：约 1–4 小时",bullets:["CPU 体质","内存颗粒","主板型号","优化项目复杂程度","稳定性测试结果"]}],note:"调试期间需要保持在线配合，部分情况可能需要视频或语音确认 BIOS 状态。超频不是套用固定模板，而是针对每一台电脑进行独立调校。"}],nx=[{v:"40,000+",l:"已完成调校台数",accent:!0},{v:"自研超频工具箱",l:"配套调校流程 · 参数辅助与存档",highlight:!0},{v:"自研电脑系统优化器",l:"系统层调优 · 释放整机性能余量",highlight:!0}],ix=[{n:"01",title:"售后周期",tone:"benefit",desc:"不同超频方案对应不同售后周期，具体以购买套餐说明为准。超频完成后，我们提供对应周期的免费技术支持，协助解决超频相关稳定性问题。"},{n:"02",title:"问题反馈",tone:"benefit",desc:"若在使用过程中出现与超频相关的闪退、蓝屏等问题，请及时提交售后工单。"},{n:"03",title:"禁改 BIOS",tone:"warn",desc:"自行修改、清空 BIOS 或恢复默认值，将视为自动放弃售后支持。"},{n:"04",title:"硬件变更",tone:"warn",desc:"自行更换 CPU、主板、内存等核心硬件，不在本售后服务范围内。"}],fm=["蓝屏 / 死机","游戏闪退","降频 / 温度异常","内存报错","开机异常","其他问题"],ux=["2133","2400","2666","2933","3000","3200","3466","3600","3733","3800","4000","4133","4200","4266","4400","4600","4800","5000","5200","5400","5600","5800","6000","6200","6400","6600","6800","7000","7200","7400","7600","7800","8000","8200","8400","8600","8800","9000","9200","9400","9600","9800","10000"],cx=["14","16","18","20","22","24","26","28","30","32","34","36","38","40","42","44","46","48","50","52","54","56","58","60","62","64","66","68","70"],sx=Array.from({length:41},(f,x)=>(3+x*.1).toFixed(2)),Ns=[{id:"t-9800x3d-5070",name:"何先生 · 南京",config:"R7 9800X3D + B850 + RTX 5070",plan:"深度调校",tag:"CS2",quote:"9800X3D 配 5070 打 CS2，以前对枪时偶尔会突然卡一下。MOSES 把 PBO、内存小参和显卡 V/F 曲线一起调完，画面连贯多了，拉枪和急停明显更跟手，再也没有那种「顿一下」的感觉。",feeling:"X3D+5070 满血",highlight:"操作更跟手",rating:5},{id:"t-9950x3d-5090",name:"冯先生 · 深圳",config:"R9 9950X3D + X870E + RTX 5090",plan:"极限定制",tag:"PUBG",quote:"9950X3D 加 5090 旗舰机，默认设置感觉发挥不出来。深度调校后 PUBG 4K 三高画质丝滑很多，CPU 游戏缓存和内存带宽都拉满了，开镜缩放顺畅，跑图和扫车不再忽快忽慢。",feeling:"旗舰发挥出来了",highlight:"4K 丝滑运行",rating:5},{id:"t-9850x3d",name:"许先生 · 成都",config:"R7 9850X3D + B850 + DDR5 6400",plan:"深度调校",tag:"永劫无间",quote:"从 9800X3D 升级到 9850X3D 后自己调 PBO 总是不稳。交给 MOSES 做完整调校，永劫三排团战明显比升级前更稳，振刀和蓄力不再飘，连招衔接顺了很多。内存 6400 C28 也一并压过 TM5，省心。",feeling:"新 X3D 调透了",highlight:"团战更稳",rating:5},{id:"t-14700kf",name:"马先生 · 天津",config:"i7-14700KF + Z790 + RTX 5070 Ti",plan:"深度调校",tag:"CS2",quote:"14700KF 大小核默认调度，打 CS2 时后台一多就容易抽风。调校后关掉多余 E 核干扰、全核曲线和内存延迟一起优化，同样设置下画面流畅一致，peek 和对枪心里踏实多了。",feeling:"14700KF 稳了",highlight:"大小核调顺",rating:5},{id:"t-cs2",name:"林先生 · 苏州",config:"i7-13700KF + Z790 + RTX 4070",plan:"深度调校",tag:"CS2",quote:"打 CS2 竞技最怕对枪时画面突然一顿，直接输。MOSES 把内存小参和 CPU 曲线一起压完，小镇和竞技图都流畅很多，急停、甩枪手感顺了，长时间打也不累。",feeling:"对枪更踏实",highlight:"画面更连贯",rating:5},{id:"t-pubg",name:"黄先生 · 重庆",config:"R5 7600X + B650 + RTX 4060 Ti",plan:"深度调校",tag:"PUBG",quote:"PUBG 艾伦格跳伞落地和开车时经常微卡顿，以为是网络问题。调校后发现是内存延迟和 CPU 功耗墙在作怪，优化后同样画质流畅很多，扫车跟枪不再一抽一抽的。",feeling:"跟枪顺了",highlight:"落地不卡了",rating:5},{id:"t-naraka",name:"阿杰先生 · 杭州",config:"i5-14600K + RTX 4070 SUPER",plan:"深度调校",tag:"永劫无间",quote:"永劫三排打团最吃 CPU，以前一开大就明显发飘、操作迟滞。调校后同样画质团战流畅很多，振刀时机好把握多了。风扇转速还降了一档，室友终于不嫌吵了。",feeling:"团战不飘了",highlight:"振刀更准",rating:5},{id:"t-abroad",name:"陈先生 · 英国伦敦",config:"R7 7800X3D + RTX 4080 · 寄修不便",plan:"远程调校",tag:"海外留学生",quote:"人在英国，机器是国内带来的，当地没人敢动 BIOS。约北京时间晚上远程，工程师全程共享屏幕操作，我这边看着就行。调完 CS2 和 Valorant 都稳，参数存档发我邮箱，时差沟通也很配合。",feeling:"异国也能调",highlight:"跨洋远程",rating:5},{id:"t-abroad2",name:"王女士 · 美国加州",config:"i9-14900K + Z790 + DDR5 6400",plan:"远程调校",tag:"海外留学生",quote:"留学期间电脑突然频繁蓝屏，不敢自己乱改 BIOS。微信联系 MOSES 约远程，从排查 XMP 到逐核调电压，两个多小时搞定。之后写代码、打 PUBG 都没再崩过，售后群有问题也能及时回。",feeling:"留学党救星",highlight:"蓝屏归零",rating:5},{id:"t1",name:"张先生 · 上海",config:"i9-14900K + Z790 + DDR5 6000",plan:"深度调校",tag:"永劫无间",quote:"之前自己开 XMP 偶尔蓝屏，MOSES 远程帮我逐核调完，打永劫三小时零报错。最惊喜是同样流畅度下风扇转速明显下来了，机箱不再像起飞。",feeling:"稳定了，也安静了",highlight:"更稳更安静",rating:5},{id:"t-cs2b",name:"吴先生 · 北京",config:"R7 9800X3D + B850 + RTX 5070",plan:"基础调校",tag:"CS2",quote:"第二台机也是 9800X3D 配 5070，默认 PBO 温度偏高。基础方案把曲线和风扇策略理顺，CS2 死斗手感顺了很多，核心温度从 78°C 降到 68°C，夏天也敢长时间打。",feeling:"X3D 发挥满",highlight:"温度 ↓10°C",rating:5},{id:"t-pubg2",name:"郑先生 · 广州",config:"i7-14700KF + Z790 + RTX 4080 SUPER",plan:"深度调校",tag:"PUBG",quote:"打 PUBG 竞技模式，以前 2K
