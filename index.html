盘状态也可能影响游戏加载和资源读取表现，例如固态硬盘缓存、健康状态、读写性能等。如果卡顿原因来自硬盘或其他硬件问题，超频优化无法解决该类问题。因此在调试前，我们会根据你的硬件配置进行分析，判断问题是否适合通过超频优化改善。"},{q:"超频会伤硬件吗？",paragraphs:["合理范围内的超频不会等同于「伤硬件」。专业调校不会盲目提高电压，而是根据硬件体质寻找性能、温度和稳定性的平衡。调试过程中会关注："],bullets:["电压是否合理","温度是否正常","稳定性是否通过测试","长时间使用是否可靠"],note:"目标不是追求极限跑分，而是获得适合日常使用和游戏的稳定性能。"},{q:"我们只提供真实有效的调校方案",paragraphs:["超频是一项基于硬件体质的技术服务，不同 CPU、内存、主板和散热环境都会影响最终结果。","为了保证服务质量，我们不会做无法验证的性能承诺："],bullets:["不承诺固定超频频率，最终参数以硬件稳定性测试结果为准。","不承诺固定 FPS 提升，实际效果取决于游戏、显卡占用、系统环境等因素。","不追求所有设备达到极限参数，稳定运行优先于极限跑分。","暂不提供笔记本平台超频服务（散热和供电条件限制较多）。"],afterBullets:["调试完成后，我们会进行稳定性测试，并确认最终方案。","若测试通过并完成交付，代表双方已确认本次调校结果。后续因个人需求变化、期望调整等非技术问题，不作为退款依据。","我们的目标不是追求夸张的数据，而是让你的电脑在合理范围内发挥更稳定、更适合实际使用的性能。"]},{q:"超频会不会损坏硬件或影响保修？",a:"我们所有调校都在厂商标定的电压安全区间内进行，并以温度墙与长时稳定性为第一优先级。绝大多数主板 BIOS 层面的超频不会触发硬件保修条款；涉及拆装散热、更换导热材料等可能影响保修的操作，我们会在动手前明确告知并征得您同意。"},{q:"远程调校安全吗？需要准备什么？",a:"远程会话全程录屏，仅操作 BIOS 与性能相关软件，不接触个人文件。您需要准备一台可联网的副机或手机用于沟通，以及在断电重启后可自行进入 BIOS 的基本操作能力，我们会一步步指引。"},{q:"调校后不稳定怎么办？",a:"质保期内免费复调，不限次数。我们会保留您的原始 BIOS 配置与超频配置双份存档，任何时候都可以一键回滚到出厂状态。"},{q:"支持哪些平台和硬件？",a:"Intel 12/13/14 代及 Core Ultra 系列，AMD Ryzen 3000–9000 系列，主流 Z / B / X 系列主板，NVIDIA RTX 20 系及以后、AMD RX 6000 系及以后显卡。工作站与服务器平台请单独咨询。"}],G0=[{title:"什么是超频？",paragraphs:["超频不是简单地拉高频率，也不是通过暴力加压去换性能。","真正的超频，是根据 CPU 体质、内存颗粒、主板供电、散热条件，重新调整一套更适合你电脑的参数，让硬件发挥出更合理的性能。","很多玩家对超频存在误解，认为超频就是高电压、高温度、伤硬件。这种为了跑分而盲目堆电压的方式，确实不值得推荐。","专业调校的核心不是「压榨硬件」，而是在性能、温度、功耗和稳定性之间找到最佳平衡点。"]},{title:"为什么默认设置不是最佳状态？",paragraphs:["CPU、内存和主板出厂参数，需要兼容大量不同硬件组合。为了保证所有用户都能正常启动，厂家通常会采用："],bullets:["保守频率","较高安全电压","宽松内存时序","默认功耗限制"],note:"这些参数可以保证稳定，但并不一定适合你的这台电脑。同一型号 CPU，不同体质可能存在明显差异。优秀的调校，就是找到属于你这颗 CPU、这套内存的最佳参数。"},{title:"合理调校为什么可能降低温度？",paragraphs:["性能提升并不一定意味着温度增加。很多情况下，默认设置为了保证兼容性，会给 CPU 提供较高电压。更合理的调校方式通常是："],bullets:["优化 CPU 电压","调整功耗限制","优化频率曲线","调整内存时序"],subsections:[{title:"让硬件减少不必要的电压消耗，在更稳定的状态下运行，结果可能出现：",bullets:["性能提升","温度下降","功耗降低","频率更加稳定"]}]},{title:"CPU + 内存双调校",paragraphs:["我们提供的不只是单独 CPU 超频，而是 CPU 与内存协同优化。"],subsections:[{title:"CPU 影响",bullets:["计算性能","游戏帧率上限","多任务响应"]},{title:"内存影响",bullets:["数据延迟","游戏响应速度","CPU 数据调用效率"]},{title:"同时结合",bullets:["主板 BIOS 设置","电压调整","稳定性测试"]}],note:"让整个平台达到更好的性能表现。"},{title:"超频能改善什么？",paragraphs:["超频最大的提升，通常不是平均帧率突然翻倍，而是改善游戏过程中不稳定的体验。例如："],bullets:["团战瞬间掉帧","快速转视角卡顿","跑图加载不顺","Low FPS 偏低","帧时间波动明显"],subsections:[{title:"CPU 性能释放",paragraphs:["让 CPU 在合理电压和温度下稳定运行。"]},{title:"内存性能释放",paragraphs:["根据内存颗粒和平台能力调整频率及时序。"]},{title:"Low 帧优化",paragraphs:["降低帧时间波动，让游戏画面更加稳定流畅。"]},{title:"性能上限释放",paragraphs:["在硬件体质允许范围内，提高平台性能潜力。"]},{title:"温度与功耗优化",paragraphs:["Intel 平台重点优化电压、功耗和温度；AMD 平台重点优化 PBO、曲线和内存性能。"]}]},{title:"调试过程需要多久？",paragraphs:["超频调试不是修改几个参数后立即完成。过程中可能需要进入 BIOS 调整参数、多次重启测试、稳定性测试与游戏实际验证。","部分参数测试期间可能出现蓝屏、黑屏或自动恢复默认设置——这是寻找稳定参数过程中的正常测试现象，并不代表硬件损坏。"],subsections:[{title:"一般调试时间：约 1–4 小时",bullets:["CPU 体质","内存颗粒","主板型号","优化项目复杂程度","稳定性测试结果"]}],note:"调试期间需要保持在线配合，部分情况可能需要视频或语音确认 BIOS 状态。超频不是套用固定模板，而是针对每一台电脑进行独立调校。"}],Q0=[{v:"6,800+",l:"已完成调校台数"},{v:"17.4%",l:"平均多核性能提升"},{v:"99.2%",l:"长时稳定性通过率"},{v:"视现场",l:"情况而定"}],Z0=[{n:"01",title:"售后周期",tone:"benefit",desc:"不同超频方案对应不同售后周期，具体以购买套餐说明为准。超频完成后，我们提供对应周期的免费技术支持，协助解决超频相关稳定性问题。"},{n:"02",title:"问题反馈",tone:"benefit",desc:"若在使用过程中出现与超频相关的闪退、蓝屏等问题，请及时提交售后工单。"},{n:"03",title:"禁改 BIOS",tone:"warn",desc:"自行修改、清空 BIOS 或恢复默认值，将视为自动放弃售后支持。"},{n:"04",title:"硬件变更",tone:"warn",desc:"自行更换 CPU、主板、内存等核心硬件，不在本售后服务范围内。"}],em=["蓝屏 / 死机","游戏闪退","降频 / 温度异常","内存报错","开机异常","其他问题"],js=[{id:"t-9800x3d-5070",name:"何同学 · 南京",config:"R7 9800X3D + B850 + RTX 5070",plan:"深度调校",tag:"CS2",quote:"9800X3D 配 5070 打 CS2，以前对枪时偶尔会突然卡一下。MOSES 把 PBO、内存小参和显卡 V/F 曲线一起调完，画面连贯多了，拉枪和急停明显更跟手，再也没有那种「顿一下」的感觉。",feeling:"X3D+5070 满血",highlight:"操作更跟手",rating:5},{id:"t-9950x3d-5090",name:"冯先生 · 深圳",config:"R9 9950X3D + X870E + RTX 5090",plan:"极限定制",tag:"PUBG",quote:"9950X3D 加 5090 旗舰机，默认设置感觉发挥不出来。深度调校后 PUBG 4K 三高画质丝滑很多，CPU 游戏缓存和内存带宽都拉满了，开镜缩放顺畅，跑图和扫车不再忽快忽慢。",feeling:"旗舰发挥出来了",highlight:"4K 丝滑运行",rating:5},{id:"t-9850x3d",name:"许同学 · 成都",config:"R7 9850X3D + B850 + DDR5 6400",plan:"深度调校",tag:"永劫无间",quot
